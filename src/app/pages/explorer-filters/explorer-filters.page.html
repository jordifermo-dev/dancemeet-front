<ion-content [fullscreen]="true" class="explorer-filters-content">
  <div class="explorer-filters-container">
    <div class="top-bar">
      <h1>{{ 'explorer.filterAllTitle' | translate }}</h1>
      <button type="button" class="close-button" (click)="goBack()">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>

    <app-filter-all
      [showSaveAsPreference]="true"
      [eventTypeChips]="eventTypeChips()"
      [disciplineChips]="disciplineChips()"
      [statusChips]="statusChips()"
      [priceChips]="priceChips()"
      [quickDateChips]="quickDateChips()"
      dateFromId="explorerFiltersDateFrom"
      dateToId="explorerFiltersDateTo"
      [dateToIsUnset]="filters.draftDateTo() === undefined"
      [applied]="applyAllFlash.active()"
      (chipToggle)="onChipToggle($event)"
      (clearDateTo)="clearDraftDateTo()"
      (saveAsPreference)="saveAll()"
      (reset)="resetAll()"
      (apply)="applyAll()"
    ></app-filter-all>

    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime
          #explorerFiltersDateFromPicker
          id="explorerFiltersDateFrom"
          presentation="date"
          [value]="filters.draftDateFromIso()"
          (ionChange)="onDraftDateFromChange($event)"
        ></ion-datetime>
        <div class="calendar-picker-actions">
          <ion-button expand="block" fill="outline" color="primary" (click)="explorerFiltersDateFromPicker.cancel(true)">
            {{ 'explorer.calendarExit' | translate }}
          </ion-button>
          <ion-button expand="block" color="primary" (click)="explorerFiltersDateFromPicker.confirm(true)">
            {{ 'explorer.calendarApply' | translate }}
          </ion-button>
        </div>
      </ng-template>
    </ion-modal>
    <ion-modal [keepContentsMounted]="true">
      <ng-template>
        <ion-datetime
          #explorerFiltersDateToPicker
          id="explorerFiltersDateTo"
          presentation="date"
          [value]="filters.draftDateToIso()"
          (ionChange)="onDraftDateToChange($event)"
        ></ion-datetime>
        <div class="calendar-picker-actions">
          <ion-button expand="block" fill="outline" color="primary" (click)="explorerFiltersDateToPicker.cancel(true)">
            {{ 'explorer.calendarExit' | translate }}
          </ion-button>
          <ion-button expand="block" color="primary" (click)="explorerFiltersDateToPicker.confirm(true)">
            {{ 'explorer.calendarApply' | translate }}
          </ion-button>
        </div>
      </ng-template>
    </ion-modal>
  </div>
</ion-content>
