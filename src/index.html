<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>DanceMeet</title>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>
  <meta name="theme-color" content="#106568"/>

  <script>
    // Applies the dark class before Angular/Ionic load, so a saved dark
    // preference doesn't flash light first. Mirrors ThemeService's default
    // (src/app/services/theme.service.ts) - keep the two in sync if that
    // logic ever changes.
    (function () {
      if (localStorage.getItem('dancemeet_theme') === 'dark') {
        document.documentElement.classList.add('ion-palette-dark');
      }
    })();
  </script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="DanceMeet"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
